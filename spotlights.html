<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Spotlights - Home Alone on Bay Hill</title>
    <script src="config.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: url('AdobeStock_375652874.jpeg') no-repeat center center fixed;
               background-size: cover; color: black; text-align: center; }
        .container { max-width: 560px; margin: 22px auto; padding: 22px; background: rgba(255,255,255,.93);
                     border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
        h1 { color: darkred; font-size: 30px; margin: 0 0 6px; }
        .lead { font-size: 16px; line-height: 1.5; color: #333; margin: 0 0 18px; }
        .back { display: inline-block; margin-bottom: 14px; color: darkgreen; font-weight: bold; text-decoration: none; }
        .spot { background: #fff8e6; border: 2px solid darkgreen; border-radius: 10px; padding: 12px; margin: 0 0 18px; scroll-margin-top: 12px; }
        .spot.today { border-color: #b8860b; box-shadow: 0 0 0 3px #ffd70088; }
        .spot h2 { color: darkred; font-size: 21px; margin: 2px 0; }
        .spot .meta { font-size: 13px; color: #555; letter-spacing: .04em; text-transform: uppercase; }
        .spot .tag { font-size: 15px; color: #333; font-style: italic; margin: 2px 0 8px; }
        .badge { display: inline-block; background: #b8860b; color: white; font-size: 12px; font-weight: bold; border-radius: 4px; padding: 2px 7px; margin-left: 6px; }
        video { width: 100%; max-height: 78vh; border-radius: 8px; background: #000; display: block; margin: 0 auto; }
        .share { margin-top: 8px; font: inherit; font-size: 15px; padding: 8px 14px; border: 0; border-radius: 6px; background: darkgreen; color: white; cursor: pointer; }
        .next { font-size: 15px; color: #333; background: #eef5ee; border-radius: 8px; padding: 12px; }
        .credit { font-size: 13px; color: #555; margin-top: 18px; }
        @media (max-width: 560px) { .container { margin: 10px; padding: 15px; } h1 { font-size: 25px; } }
    </style>
</head>
<body>
<div class="container">
    <a class="back" href="index.html">← Back to Home</a>
    <h1>🎬 Character Spotlights</h1>
    <p class="lead">Every night until Thanksgiving, we spotlight one of the life-size characters in our yard: the movie story behind them and how they were made.</p>

    <div id="list"></div>
    <div class="next" id="next" hidden></div>
    <p class="credit">All artwork hand-drawn and hand-painted by Angie Howard.</p>
</div>

<script>
const B = window.BAYHILL, today = B.now().ymd;
const out = B.released().slice().reverse();       // newest first
const nice = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric", timeZone: "UTC" });

document.getElementById("list").innerHTML = out.map(s => `
    <div class="spot${s.date === today ? " today" : ""}" id="${s.date}">
        <div class="meta">${nice(s.date)}${s.date === today ? '<span class="badge">TODAY</span>' : ""}</div>
        <h2>${s.name}</h2>
        ${s.tag ? `<div class="tag">${s.tag}</div>` : ""}
        <video controls playsinline preload="metadata" src="${s.file}#t=0.5"></video>
        <button class="share" type="button" data-d="${s.date}" data-n="${s.name}">Share this spotlight</button>
    </div>`).join("") || "<p>The first spotlight is coming soon!</p>";

const upcoming = B.spotlights.filter(s => s.date > today);
if (upcoming.length) {
    const n = document.getElementById("next");
    n.innerHTML = `🎁 <b>${upcoming.length} more spotlight${upcoming.length > 1 ? "s" : ""}</b> coming before opening night. Next one drops ${nice(upcoming[0].date)}. Who could it be?`;
    n.hidden = false;
}

document.querySelectorAll(".share").forEach(b => b.onclick = async () => {
    const url = location.href.split("#")[0] + "#" + b.dataset.d;
    const data = { title: "Home Alone on Bay Hill", text: `Character Spotlight: ${b.dataset.n}`, url };
    try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(url); b.textContent = "Link copied!"; } } catch (e) {}
});

/* play one video at a time */
document.querySelectorAll("video").forEach(v => v.addEventListener("play", () =>
    document.querySelectorAll("video").forEach(o => { if (o !== v) o.pause(); })));

</script>
</body>
</html>
